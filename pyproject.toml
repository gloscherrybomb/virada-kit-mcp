[project]
name = "virada-kit"
version = "0.1.0"
description = "MCP server: an AI agent turns kit pictures into a Virada cycling kit file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]

[project.scripts]
virada-kit = "virada_kit.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
